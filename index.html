<!doctype html>
<html lang="en" class="scroll-smooth">

    <meta
      name="description"
      content="Digital systems built to help Canadian businesses grow. Websites, Shopify, advertising, creative content, SEO, and AI automation."
    />
    <link rel="canonical" href="https://northform.digital" />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Northform Digital Studio — Digital Systems for Canadian Businesses" />
    <meta
      property="og:description"
      content="Websites, advertising, creative content, SEO, and AI automation — built for modern Canadian businesses."

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Northform Digital Studio — Digital Systems for Canadian Businesses" />
    <meta
      name="twitter:description"
      content="Websites, advertising, creative content, SEO, and AI automation — built for modern Canadian businesses."
    />

    <!-- Fonts: Plus Jakarta Sans for refined editorial/body + JetBrains Mono for tabular numerals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Northform Digital Studio",
      "description": "Digital systems built to help Canadian businesses grow. Websites, Shopify, advertising, creative content, SEO, and AI automation.",
      "url": "https://northform.digital",
      "priceRange": "$$$",
      "areaServed": {
        "@type": "Country",
        "name": "Canada"
      },
      "knowsAbout": [
        "Website Design",
        "Shopify E-commerce",
        "Meta Advertising",
        "Video Editing",
        "AI Video Production",
        "Search Engine Optimization",
        "AI Voice Automation"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Growth Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Website Design",
              "description": "Professional, conversion-focused websites built to make your business look credible and guide visitors toward action."
            },
            "price": "1200",
            "priceCurrency": "CAD"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Shopify E-commerce",
              "description": "Conversion-focused Shopify stores designed for a smoother customer journey."
            },
            "price": "1700",
            "priceCurrency": "CAD"
          }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-[#090A0D] text-[#F5F6F8] antialiased selection:bg-[#2563EB] selection:text-white">

</html>
